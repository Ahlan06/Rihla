<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rihla · Traversée 3D</title>
<style>*{box-sizing:border-box}body{margin:0;background:#222039;color:#fff0cf;font:16px system-ui}canvas{width:100vw;height:100dvh;display:block;touch-action:none}header,footer,#menu{position:absolute}header{inset:22px 5% auto;display:flex;justify-content:space-between;font:700 16px monospace;text-shadow:0 2px 5px #111}footer{bottom:14px;width:100%;text-align:center;text-shadow:0 1px 4px black;pointer-events:none}#menu{left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;width:min(90%,480px);text-shadow:0 2px 8px #251c29}h1{font:italic 58px Georgia;margin:4px}button{background:#f1c78c;border:0;border-radius:3px;padding:12px 24px;font:700 16px system-ui;color:#302436}a{color:inherit}</style>
<canvas aria-label="Désert de Rihla en 3D"></canvas><header><a href="/">Rihla · 2D</a><span id="score">0 m</span></header><section id="menu"><small>رحلة</small><h1>Rihla 3D</h1><p id="msg">Une traversée de vingt secondes.</p><button id="go" disabled>Chargement…</button></section><footer>← → ou glisser pour esquiver · Espace ou toucher pour sauter</footer>
<script type="module">
const msg=document.querySelector('#msg'),go=document.querySelector('#go'),menu=document.querySelector('#menu'),canvas=document.querySelector('canvas');
try {
const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(53,1,.1,420);
scene.fog=new T.FogExp2(0xb18d93,.008);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);
const sky=new T.Mesh(new T.SphereGeometry(350,40,24),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,vertexShader:'varying float h;void main(){h=position.y/350.;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying float h;void main(){gl_FragColor=vec4(mix(vec3(.87,.55,.42),vec3(.09,.10,.24),smoothstep(-.05,.53,h)),1.); }'}));scene.add(sky);
scene.add(new T.HemisphereLight(0xffe0d6,0x755a78,1.65));
const sun=new T.DirectionalLight(0xffcc91,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,far:90});sun.shadow.camera.updateProjectionMatrix();sun.shadow.normalBias=.035;scene.add(sun,sun.target);
function group(parent,x=0,y=0,z=0){const g=new T.Group();g.position.set(x,y,z);parent.add(g);return g}
function mesh(parent,geo,color,x,y,z){const m=new T.Mesh(geo,new T.MeshStandardMaterial({color,roughness:.85}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
const sphere=new T.SphereGeometry(1,18,14);
function oval(p,c,x,y,z,a,b,d){const m=mesh(p,sphere,c,x,y,z);m.scale.set(a,b,d);return m}
function height(x,z){return 2.6*Math.sin(z*.065+.48*Math.sin(x*.09))+1.1*Math.sin(z*.13+x*.07)+2.2*Math.sin(x*.13+z*.025)}
const land=new T.PlaneGeometry(300,360,180,240);land.rotateX(-Math.PI/2);land.translate(0,0,-95);
const pos=land.attributes.position,colors=[];
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,height(x,z));const c=new T.Color().setRGB(.54,.315,.195).multiplyScalar(.96+.04*Math.sin(x*7+z*2)+.025*Math.cos(z*9));colors.push(c.r,c.g,c.b)}
land.setAttribute('color',new T.Float32BufferAttribute(colors,3));land.computeVertexNormals();const dunes=new T.Mesh(land,new T.MeshStandardMaterial({vertexColors:true}));dunes.receiveShadow=true;scene.add(dunes);
for(const [x,z,r] of [[-34,-75,17],[28,-132,24],[49,-145,14]]){const m=mesh(scene,new T.ConeGeometry(r,r*1.25,4),0xb58665,x,height(x,z)+r*.49,z);m.rotation.y=Math.PI/4}
const moon=new T.Mesh(sphere,new T.MeshBasicMaterial({color:0xffdfa3}));moon.scale.setScalar(8);scene.add(moon);
const root=group(scene),body=group(root),coat=0x29232b, mane=0x18151d;
oval(body,coat,0,1.48,0,.51,.59,1.03);oval(body,coat,0,1.52,.54,.55,.60,.62);
const neck=oval(body,coat,0,1.99,-.72,.32,.72,.39);neck.rotation.x=-.47;
oval(body,coat,0,2.51,-1.02,.24,.32,.37);oval(body,0x423840,0,2.38,-1.32,.19,.21,.26);
for(const x of [-.16,.16]){const ear=mesh(body,new T.ConeGeometry(.095,.31,8),coat,x,2.83,-.96);ear.rotation.z=-x}
const tail=oval(body,mane,0,1.12,1.01,.18,.59,.17);tail.rotation.x=-.22;
const legs=[];
for(const x of [-.31,.31])for(const z of [-.59,.62]){const hip=group(body,x,1.34,z),knee=group(hip,0,-.59,0);oval(hip,coat,0,-.25,0,.15,.39,.18);oval(knee,coat,0,-.26,0,.085,.31,.095);oval(knee,mane,0,-.55,-.025,.104,.10,.14);legs.push({hip,knee,x,z})}
oval(body,0x674632,0,1.99,.03,.46,.15,.48);const rider=group(body,0,2,0);
mesh(rider,new T.CylinderGeometry(.24,.42,.85,20),0xeee6d7,0,.39,0);
for(const x of [-.37,.37]){oval(rider,0xe5dfd3,x,-.12,.03,.16,.35,.20);oval(rider,0x503a32,x,-.42,-.03,.12,.14,.18);const arm=oval(rider,0xeae2d3,x*.8,.55,-.10,.12,.30,.13);arm.rotation.x=.48}
const cloth=document.createElement('canvas');cloth.width=cloth.height=64;const brush=cloth.getContext('2d');brush.fillStyle='#eee8da';brush.fillRect(0,0,64,64);brush.strokeStyle='#28252a';brush.lineWidth=3;for(let i=-64;i<128;i+=12){brush.beginPath();brush.moveTo(i,0);brush.lineTo(i+64,64);brush.moveTo(i,0);brush.lineTo(i-64,64);brush.stroke()}
const scarf=new T.CanvasTexture(cloth);scarf.colorSpace=T.SRGBColorSpace;
for(const m of [oval(rider,0xffffff,0,.99,0,.24,.27,.24),oval(rider,0xffffff,0,.73,.16,.31,.31,.15)])m.material.map=scarf;
oval(rider,0x29242a,0,1.08,0,.244,.052,.242);
const spirit=group(scene,0,height(0,-80),-80);mesh(spirit,new T.ConeGeometry(.71,2.1,18),0x19171e,0,1.26,0);oval(spirit,0x211e25,0,2.12,0,.38,.49,.36);
for(const x of [-.13,.13]){const eye=oval(spirit,0xff6841,x,2.17,.33,.066,.025,.037);eye.material.emissive.setHex(0xff4522)}
let state='ready',dist=0,lane=0,lateral=0,jump=0,vy=0,last=performance.now();
function start(){dist=lane=lateral=jump=vy=0;state='run';menu.hidden=true}
function end(message){state='done';msg.textContent=message;go.textContent='Rejouer';menu.hidden=false}
function leap(){if(state==='run'&&!jump&&!vy)vy=5.4}
function move(dir){if(state==='run')lane=Math.max(-1,Math.min(1,lane+dir))}
go.disabled=false;go.textContent='Partir';go.onclick=start;
addEventListener('keydown',e=>{if(state!=='run'||!['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))return;e.preventDefault();if(e.repeat)return;if(e.code==='ArrowLeft')move(-1);else if(e.code==='ArrowRight')move(1);else leap()});
let touch=null;canvas.onpointerdown=e=>{touch=e.clientX;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=e=>{if(touch===null)return;const dx=e.clientX-touch;touch=null;if(Math.abs(dx)>22)move(Math.sign(dx));else leap()};canvas.onpointercancel=()=>touch=null;
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(state==='run'){dist+=8*dt;lateral+=(lane*1.75-lateral)*(1-Math.exp(-12*dt));jump=Math.max(0,jump+vy*dt);vy=jump>0?vy-13*dt:0;if(Math.abs(dist-80)<.65&&Math.abs(lateral)<.75)end('Le djinn a barré le passage. Esquive sur le côté.');else if(dist>=160)end('Tu as franchi les dunes.')}
const z=-dist,ground=height(lateral,z),phase=dist*2.3;root.position.set(lateral,ground+jump,z);root.rotation.x=Math.atan((height(lateral,z-1)-height(lateral,z+1))/2);
body.position.y=.055*Math.sin(phase*2);rider.rotation.x=.07*Math.sin(phase);tail.rotation.z=.10*Math.sin(phase);
for(const leg of legs){const t=phase+(leg.x>0?.75:0)+(leg.z>0?2.8:0);leg.hip.rotation.x=jump?.35:.46*Math.sin(t);leg.knee.rotation.x=jump?-.9:-.46*Math.max(0,Math.cos(t))}
camera.position.set(lateral*.58+1.1,Math.max(ground+3.75,height(lateral,z+5)+2.6),z+5.3);camera.lookAt(lateral*.55,ground+1.7,z-3.5);sky.position.copy(camera.position);moon.position.set(-62,42,z-162);
sun.position.set(-15,ground+19,z+5);sun.target.position.set(lateral,ground,z);spirit.position.y=height(0,-80)+.15*Math.sin(now*.003);
document.querySelector('#score').textContent=Math.floor(dist)+' m';renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame)
}catch(error){msg.textContent='Chargement 3D impossible. Vérifie la connexion et la prise en charge de WebGL.';go.textContent='Réessayer';go.disabled=false;go.onclick=()=>location.reload();console.error(error)}
</script></html>
