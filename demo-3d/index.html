<script type="module">
const msg=document.querySelector('#msg'),go=document.querySelector('#go'),menu=document.querySelector('#menu'),canvas=document.querySelector('canvas');
try {
const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const pixelMode=new URLSearchParams(location.search).get('style')==='pixel';
if(pixelMode){
  canvas.style.imageRendering='pixelated';
  document.querySelector('h1').textContent='Rihla · Pixel 3D';
}
const renderer=new T.WebGLRenderer({canvas,antialias:!pixelMode});
renderer.setPixelRatio(pixelMode ? 1 : Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(53,1,.1,420);
scene.fog=new T.FogExp2(0xb18d93,.008);
function resize(){const scale=pixelMode ? Math.min(1,300/innerHeight,580/innerWidth) : 1;renderer.setSize(Math.round(innerWidth*scale),Math.round(innerHeight*scale),false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);
const sky=new T.Mesh(new T.SphereGeometry(350,40,24),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,vertexShader:'varying float h;void main(){h=position.y/350.;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying float h;void main(){gl_FragColor=vec4(mix(vec3(.87,.55,.42),vec3(.09,.10,.24),smoothstep(-.05,.53,h)),1.); }'}));scene.add(sky);
if(pixelMode){
 sky.material.fragmentShader=sky.material.fragmentShader.replace('smoothstep(-.05,.53,h)','floor(smoothstep(-.05,.53,h)*18.)/18.');
 scene.fog.color.setHex(0xb08391);
}
scene.add(new T.HemisphereLight(0xffe0d6,0x755a78,1.65));
const sun=new T.DirectionalLight(0xffcc91,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,far:90});sun.shadow.camera.updateProjectionMatrix();sun.shadow.normalBias=.035;scene.add(sun,sun.target);
function group(parent,x=0,y=0,z=0){const g=new T.Group();g.position.set(x,y,z);parent.add(g);return g}
function mesh(parent,geo,color,x,y,z){const m=new T.Mesh(geo,new T.MeshStandardMaterial({color,roughness:.85}));if(pixelMode){
 m.material.onBeforeCompile=shader=>{
   shader.fragmentShader=shader.fragmentShader.replace('#include <dithering_fragment>',
    'gl_FragColor.rgb=floor(gl_FragColor.rgb*28.0+0.5)/28.0;');
 };
}
m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
const sphere=new T.SphereGeometry(1,18,14);
function oval(p,c,x,y,z,a,b,d){const m=mesh(p,sphere,c,x,y,z);m.scale.set(a,b,d);return m}
const ridgeRoute=new T.CatmullRomCurve3([[22,-148],[33,-148],[41,-144],[47,-133],[49,-114],[48,-94],[44,-76],[37,-61],[26,-50],[20,-39],[12,-33]].map(([x,z])=>new T.Vector3(x,0,z)));
function height(x,z){const ridge=3.8*Math.exp(-((x-48)**2)/86-((z+105)**2)/880);const edge=Math.max(Math.abs(x)-38,-z-182,z+84,0);const blend=Math.min(1,edge/12);return ridge+blend*blend*(3-2*blend)*( 2.6*Math.sin(z*.065+.48*Math.sin(x*.09))+1.1*Math.sin(z*.13+x*.07)+2.2*Math.sin(x*.13+z*.025))}
const land=new T.PlaneGeometry(300,360,180,240);land.rotateX(-Math.PI/2);land.translate(0,0,-95);
const pos=land.attributes.position,colors=[];
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,height(x,z));const c=new T.Color().setRGB(.54,.315,.195).multiplyScalar(.96+.04*Math.sin(x*7+z*2)+.025*Math.cos(z*9));colors.push(c.r,c.g,c.b)}
land.setAttribute('color',new T.Float32BufferAttribute(colors,3));land.computeVertexNormals();const dunes=new T.Mesh(land,new T.MeshStandardMaterial({vertexColors:true}));dunes.receiveShadow=true;scene.add(dunes);
for(const [x,z,r] of [[-34,-75,17],[65,-151,24],[83,-169,14]]){const m=mesh(scene,new T.ConeGeometry(r,r*1.25,4),0xb58665,x,height(x,z)+r*.49,z);m.rotation.y=Math.PI/4}
// Sample the same ground surface as the horse across the entire trail width.
const trackVertices=[],trackIndices=[],trackColors=[];
for(let row=0;row<=180;row++){
  const t=row/180,p=ridgeRoute.getPointAt(t),v=ridgeRoute.getTangentAt(t);
  for(let col=0;col<=8;col++){
    const offset=(col-4)*.58;
    const x=p.x-v.z*offset,z=p.z+v.x*offset;
    trackVertices.push(x,height(x,z)+.055,z);
    const shade=[1,.95,.81,.89,.94,.89,.81,.95,1][col]*(.98+.02*Math.sin(row*1.4));
    trackColors.push(.50*shade,.31*shade,.205*shade);
    if(row&&col){const n=row*9+col;trackIndices.push(n-10,n-9,n,n-10,n,n-1)}
  }
}
const trackGeometry=new T.BufferGeometry();
trackGeometry.setAttribute('position',new T.Float32BufferAttribute(trackVertices,3));
trackGeometry.setAttribute('color',new T.Float32BufferAttribute(trackColors,3));
trackGeometry.setIndex(trackIndices);trackGeometry.computeVertexNormals();
const track=new T.Mesh(trackGeometry,new T.MeshStandardMaterial({vertexColors:true,side:T.DoubleSide}));
track.receiveShadow=true;scene.add(track);
const moon=new T.Mesh(sphere,new T.MeshBasicMaterial({color:0xffdfa3}));moon.scale.setScalar(8);scene.add(moon);
// Cross sections describe the silhouette. Shared rings give continuous normals.
function sculpt(parent, color, sections, alongBack=false, folds=0) {
  const vertices=[], triangles=[], uv=[], segments=40;
  for(const [j,[axis,rx,rz,offset]] of sections.entries()){
    for(let i=0;i<=segments;i++){
      const a=i/segments*Math.PI*2;
      const wave=1+folds*(Math.sin(a*9+j*.21)+.35*Math.sin(a*15-j*.3));
      const x=rx*Math.cos(a)*wave, v=rz*Math.sin(a)*wave;
      vertices.push(x,alongBack?offset+v:axis,alongBack?axis:offset+v);
      uv.push(i/segments,j/(sections.length-1));
      if(i<segments && j<sections.length-1){
        const n=j*(segments+1)+i,s=n+segments+1;
        triangles.push(n,s,n+1,n+1,s,s+1);
      }
    }
  }
  const geo=new T.BufferGeometry();
  geo.setAttribute('position',new T.Float32BufferAttribute(vertices,3));
  geo.setAttribute('uv',new T.Float32BufferAttribute(uv,2));
  if(alongBack)triangles.reverse();
  geo.setIndex(triangles);geo.computeVertexNormals();
  const part=mesh(parent,geo,color,0,0,0);
  part.material.side=T.DoubleSide;
  return part;
}
function cord(parent,color,radius,points){
  const curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));
  return mesh(parent,new T.TubeGeometry(curve,18,radius,6,false),color,0,0,0);
}

function createCaravanCamp() {
  // Each shelter follows the dune at its own four corners.
  const canvasPaint = document.createElement('canvas');
  canvasPaint.width = 32; canvasPaint.height = 32;
  const ink = canvasPaint.getContext('2d');
  ink.fillStyle = '#58332e'; ink.fillRect(0,0,32,32);
  for (const y of [3,19]) {
    ink.fillStyle = '#b75e43'; ink.fillRect(0,y,32,6);
    ink.fillStyle = '#edc58d'; ink.fillRect(0,y+2,32,1);
    for (let x=0;x<32;x+=4) ink.fillRect(x,y+3,2,1);
  }
  const weave = new T.CanvasTexture(canvasPaint);
  weave.colorSpace = T.SRGBColorSpace; weave.magFilter = T.NearestFilter;
  const timber = new T.CylinderGeometry(.07,.09,1,6);
  function pole(x,z,h) {
    const post = mesh(scene,timber,0x664631,x,height(x,z)+h/2,z);
    post.scale.y = h;
  }
  for (const [cx,cz] of [[9,-31],[15,-39],[8,-45]]) {
    const roof = new T.PlaneGeometry(5,5,8,8);
    roof.rotateX(-Math.PI/2);
    const points = roof.attributes.position;
    for (let i=0;i<points.count;i++) {
      const x=points.getX(i), z=points.getZ(i);
      const rise=1-Math.abs(x)/2.5;
      points.setXYZ(i,cx+x,height(cx+x,cz+z)+1.45+1.45*rise*rise-.18*Math.cos(z*Math.PI/5),cz+z);
    }
    roof.computeVertexNormals();
    const cover=mesh(scene,roof,0xffffff,0,0,0);
    cover.material.map=weave; cover.material.side=T.DoubleSide;
    for(const dz of [-2.5,2.5]) for(const dx of [-2.5,0,2.5]) pole(cx+dx,cz+dz,dx===0?2.9:1.45);
  }
  const fire=group(scene,5.5,height(5.5,-37),-37);
  for(let i=0;i<8;i++){
    const angle=i*Math.PI/4;
    oval(fire,0x64524b,.76*Math.cos(angle),.09,.76*Math.sin(angle),.23,.15,.19);
  }
  const flames=[];
  for(let i=0;i<5;i++){
    const a=i*2.4, pivot=group(fire,.29*Math.sin(a),0,.29*Math.cos(a));
    const flame=mesh(pivot,new T.ConeGeometry(.31,1.24,5),0xff9635,0,.63,0);
    flame.material.emissive.setHex(i%2?0xff6318:0xffbb45);
    flame.castShadow=false; flames.push(pivot);
  }
  const glow=new T.PointLight(0xff8738,12,10);
  glow.position.y=.9; fire.add(glow);
  const sparks=new T.BufferGeometry(), dots=new Float32Array(36);
  sparks.setAttribute('position',new T.BufferAttribute(dots,3));
  const embers=new T.Points(sparks,new T.PointsMaterial({color:0xffc86a,size:.09}));
  embers.frustumCulled=false; fire.add(embers);
  const animals=[];
  for(const [x,z,angle] of [[8,-53,.75],[11,-51,-.5]]){
    const camel=group(scene,x,height(x,z),z); camel.rotation.y=angle;
    const fur=0xb98151;
    oval(camel,fur,0,1.5,0,.45,.52,.99);
    oval(camel,fur,0,1.94,.05,.31,.41,.47);
    for(const side of [-.28,.28]) for(const end of [-.61,.61]){
      const leg=mesh(camel,timber,fur,side,.87,end); leg.scale.set(1.4,1.74,1.4);
      oval(camel,0x856044,side,.07,end-.05,.12,.08,.17);
    }
    const neckBase=group(camel,0,1.56,-.63);
    cord(neckBase,fur,.17,[[0,0,0],[0,.14,-.4],[0,.68,-.58],[0,1.03,-.6]]);
    oval(neckBase,fur,0,1.05,-.73,.16,.17,.34);
    for(const side of [-.12,.12]){
      oval(neckBase,fur,side,1.24,-.56,.055,.09,.05);
      oval(neckBase,0x342927,side*1.22,1.09,-.76,.025,.03,.035);
    }
    animals.push(neckBase);
  }
  return function animateCamp(t) {
    flames.forEach((p,i)=>{
      p.scale.y=.87+.18*Math.sin(t*8+i)+.14*Math.sin(t*13+i*2);
      p.rotation.z=.13*Math.sin(t*5+i);
    });
    glow.intensity=12+2*Math.sin(t*8);
    for(let i=0;i<dots.length/3;i++){
      const h=(t*.47+i*.618)%1;
      dots[i*3]=h*.68+.22*Math.sin(i+t*2);
      dots[i*3+1]=.65+h*2.1;
      dots[i*3+2]=.25*Math.cos(i+t+h);
    }
    sparks.attributes.position.needsUpdate=true;
    animals.forEach((n,i)=>{
      n.rotation.x=.07+.24*Math.sin(t*.6+i*2.5);

const animateCamp=createCaravanCamp();

function buildMedina() {
  const cube=new T.BoxGeometry(), dome=new T.SphereGeometry(1,20,10,0,Math.PI*2,0,Math.PI/2);
  const column=new T.CylinderGeometry(.5,.55,1,12), finial=new T.ConeGeometry(.5,1,8);
  const batches=new Map(), bounds=[];
  // Static camera geometry is indexed in courtyard-sized cells, independent of draw batches.
  const cameraCells=new Map(), cameraMaterial=new T.MeshBasicMaterial({side:T.DoubleSide});
  function add(shape,x,y,z,w,h,d,color,rotation=0) {
    if(!batches.has(shape)) batches.set(shape,[]);
    const pose=new T.Object3D();
    pose.position.set(x,y,z); pose.scale.set(w,h,d); pose.rotation.z=rotation; pose.updateMatrix();

    obstacle.matrixWorld.copy(pose.matrix);
    if(!shape.boundingBox)shape.computeBoundingBox();
    const box=shape.boundingBox.clone().applyMatrix4(pose.matrix);
    for(let ix=Math.floor(box.min.x/12);ix<=Math.floor(box.max.x/12);ix++)
      for(let iz=Math.floor(box.min.z/12);iz<=Math.floor(box.max.z/12);iz++){
        const cell=ix+','+iz;
        if(!cameraCells.has(cell))cameraCells.set(cell,[]);
        cameraCells.get(cell).push(obstacle);
      }
  }
  function surface(w,h,draw) {
    const sheet=document.createElement('canvas'); sheet.width=w; sheet.height=h;
    draw(sheet.getContext('2d'));
    const tex=new T.CanvasTexture(sheet); tex.colorSpace=T.SRGBColorSpace; tex.magFilter=T.NearestFilter;
    return tex;
  }
  const facade=cube.clone();
  const masonry=surface(96,96,g=>{
    g.fillStyle='#ddb288';g.fillRect(0,0,96,96);
    for(let i=0;i<210;i++){
      g.fillStyle=i%2?'#c79b77':'#e7bf95';g.fillRect((i*47)%96,(i*37+Math.floor(i/7))%96,2+i%5,1);
    }
    for(const y of [7,12,51,84]){g.fillStyle='#ad785b';g.fillRect(0,y,96,2)}
    for(const y of [17,57])for(const x of [10,39,68]){
      g.fillStyle='#8b624e';g.fillRect(x-2,y+7,17,16);
      g.fillStyle='#413038';g.beginPath();g.moveTo(x,y+21);g.lineTo(x,y+8);g.quadraticCurveTo(x+2,y+3,x+6,y);g.quadraticCurveTo(x+12,y+4,x+13,y+8);g.lineTo(x+13,y+21);g.fill();
      g.fillStyle='#936f58';for(let j=2;j<13;j+=4)g.fillRect(x+j,y+9,1,12);
      g.fillRect(x,y+14,13,1);
    }
  });
  const paving=surface(64,64,g=>{
    g.fillStyle='#876f63';g.fillRect(0,0,64,64);
    for(let row=0;row<8;row++)for(let col=-1;col<5;col++){
      g.fillStyle=['#bea087','#c8a98b','#b69782'][Math.abs(row*7+col)%3];
      g.fillRect(col*16+(row%2)*8,row*8,15,7);
    }
  });
  paving.wrapS=paving.wrapT=T.RepeatWrapping;
  const pavingMaterial=new T.MeshStandardMaterial({map:paving});
  function pave(x,z,w,d){
    const geometry=new T.PlaneGeometry(w,d);
    const uv=geometry.attributes.uv;
    for(let i=0;i<uv.count;i++)uv.setXY(i,(x+(uv.getX(i)-.5)*w)/2.8,(-z+(uv.getY(i)-.5)*d)/2.8);
    const floor=new T.Mesh(geometry,pavingMaterial);
    floor.rotation.x=-Math.PI/2;floor.position.set(x,.075,z);floor.receiveShadow=true;scene.add(floor);
  }
  pave(0,-122,14,82);
  // Cross streets meet the side lanes edge to edge around two blocks.
  for(const side of [-1,1]){
    pave(side*15,-110,16,12);
    pave(side*15,-148,16,10);
    pave(side*19,-129.5,8,27);
    for(const z of [-110,-121,-132,-143,-154]){
      if(side===1&&z===-143)continue;
      const x=side*27,h=z===-132?7:5;
      add(facade,x,h/2,z,7,h,9,side<0?0xe8c3aa:0xe5bb91);
      add(cube,x,h,z,7.5,.35,9.4,0xb78665);
      bounds.push([x,z,3.9,4.9]);
    }
  }
  const townsfolk=[];
  function person(x,z,shade,merchant) {
    const p=group(scene,x,.08,z), torso=group(p,0,.43,0);
    mesh(torso,new T.ConeGeometry(.29,1.06,8),shade,0,.51,0);
    oval(torso,0x935f44,0,1.16,0,.15,.21,.16);
    oval(torso,0xe6ceaa,0,1.29,0,.18,.12,.18);
    const arm=group(torso,.19,.88,0);
    oval(arm,shade,.035,-.19,0,.085,.24,.085);
    const feet=[-.11,.11].map(dx=>oval(p,0x553b34,dx,.23,0,.085,.23,.11));
    townsfolk.push({p,torso,arm,feet,x,z,merchant});
  }
  // Local depth is measured from the street-facing wall into the building.
  function soukHouse(side,x,z,h,shop){
    const front=x-side*3.5;
    const at=depth=>front+side*depth;
    const plaster=side>0?0xffe8c6:0xffcfb6;
    if(shop){
      add(facade,x,(h+3)/2,z,7,h-3,9,plaster);
      add(cube,at(4.8),1.5,z,4.4,3,9,0x725344);
      for(const dz of [-3.8,3.8]){
        add(cube,at(1.3),1.5,z+dz,2.6,3,1.4,0xc89d78);
        bounds.push([at(1.3),z+dz,1.65,1.05]);
      }
      bounds.push([at(4.8),z,2.55,4.85]);
      add(cube,at(1.25),.08,z,2.7,.16,6.3,0xb38c70);
      for(const y of [.6,1.55]){
        add(cube,at(2.12),y,z,.75,.11,5.6,0x684739);
        for(let j=0;j<7;j++){
          const shelfZ=z-2.35+j*.78;
          if(side>0){
            const clay=j%2?0xc7875e:0xe5bd8b;
            add(dome,at(2.08),y+.09,shelfZ,.26,.34,.26,clay);
            add(column,at(2.08),y+.39,shelfZ,.19,.16,.19,clay);
          }else{
            for(let k=0;k<3;k++)add(cube,at(2.08),y+.12+.1*k,shelfZ,.55,.1,.64,
              [0x416d73,0xc78056,0xb34949,0xd8b679][(j+k)%4]);
          }
        }
      }
    }else{
      add(facade,x,h/2,z,7,h,9,plaster);
      bounds.push([x,z,3.85,4.85]);
    }
    const base=shop?3.24:h*.56;
    const timber=0x674536;
    add(cube,at(-.57),base,z,1.55,.25,4.35,timber);
    add(cube,at(-.57),base+1.65,z,1.65,.22,4.5,timber);
    for(const dz of [-1.94,0,1.94]){
      add(cube,at(-1.19),base+.8,z+dz,.16,1.64,.16,timber);
      if(dz!==0)add(cube,at(-.48),base-.43,z+dz,1.15,.19,.24,0x80543b,-side*.55);
    }
    for(let j=0;j<13;j++)add(cube,at(-1.21),base+.61,z-1.8+j*.3,.09,1.03,.085,0x875b40);
    for(const y of [.22,.62,1.09])add(cube,at(-1.22),base+y,z,.14,.10,4.05,timber);
  }
  for(const side of [-1,1])for(let i=0;i<6;i++){
    const z=-88-i*11, x=side*(10+(i%2)), h=5+(i*3+(side+1))%5;
    if(i===2||i===5)continue; // Open the plaza and rear cross street.
    soukHouse(side,x,z,h,i%2===1);
    add(cube,x,h,z,7.5,.38,9.5,0xd3a17c);
    add(cube,x,h+.32,z,7,.38,9,0xb98565);
    if(i%2===0){
      add(dome,x,h+.5,z,2.75,2.4,2.75,0xe0b077);
      add(finial,x,h+3.15,z,.33,.75,.33,0x95714e);
    }
    if(i%2===1){
      const sx=side*5.4;
