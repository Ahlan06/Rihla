<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rihla · Parkour (P0)</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0a14;overflow:hidden;font:14px system-ui}
  canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}
  #hud{position:fixed;left:14px;top:14px;right:14px;color:#e8e0cf;text-shadow:0 1px 3px #000;pointer-events:none}
  #hud b{color:#ffd27a}
  #hud .row{margin:2px 0}
  #dbg{position:fixed;right:14px;bottom:12px;font:12px monospace;color:#9fb6d8;text-shadow:0 1px 2px #000;pointer-events:none;text-align:right}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row"><b>Rihla · Parkour — prototype P0</b></div>
  <div class="row">Déplacer : <b>WASD / ZQSD</b> · Sauter : <b>Espace</b> · Franchir un rebord bas : <b>avancer contre le mur</b></div>
  <div class="row"><b>Grimper un mur haut</b> : avance contre lui, puis <b>W/S</b> monter/descendre, <b>A/D</b> latéral, <b>Espace</b> sauter</div>
  <div class="row">Caméra : <b>glisser la souris</b> · Réinitialiser : <b>R</b></div>
</div>
<div id="dbg">chargement…</div>
<script type="module">
(async () => {
  const dbg = document.getElementById('dbg');
  try {
    const T = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
    const RAPIER = await import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs');
    await RAPIER.init();

    // ---------- Renderer / scène ----------
    const canvas = document.getElementById('c');
    const renderer = new T.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;

    const scene = new T.Scene();
    scene.background = new T.Color(0x8fb2e0);
    scene.fog = new T.Fog(0x8fb2e0, 38, 120);

    const camera = new T.PerspectiveCamera(60, 1, 0.1, 300);

    function resize() {
      const scale = Math.min(1, 300 / innerHeight, 520 / innerWidth);
      renderer.setSize(Math.round(innerWidth * scale), Math.round(innerHeight * scale), false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    resize();
    addEventListener('resize', resize);

    // ---------- Lumières ----------
    scene.add(new T.HemisphereLight(0xcfe0ff, 0x6a4a2a, 1.1));
    const sun = new T.DirectionalLight(0xfff0d8, 2.4);
    sun.position.set(14, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, far: 90 });
    sun.shadow.camera.updateProjectionMatrix();
    scene.add(sun, sun.target);

    // ---------- Monde Rapier ----------
    const world = new RAPIER.World({ x: 0, y: -18, z: 0 });

    const groundMesh = new T.Mesh(
      new T.BoxGeometry(70, 1, 70),
      new T.MeshStandardMaterial({ color: 0xc69a6b, roughness: 0.95 }),
    );
    groundMesh.position.y = -0.5;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);
    world.createCollider(RAPIER.ColliderDesc.cuboid(35, 0.5, 35).setTranslation(0, -0.5, 0));

    const grid = new T.GridHelper(70, 70, 0x000000, 0x000000);
    grid.material.opacity = 0.08;
    grid.material.transparent = true;
    grid.position.y = 0.01;
    scene.add(grid);

    function addBox(x, y, z, w, h, d, color) {
      const mesh = new T.Mesh(new T.BoxGeometry(w, h, d), new T.MeshStandardMaterial({ color, roughness: 0.9 }));
      mesh.position.set(x, y, z);
      mesh.castShadow = mesh.receiveShadow = true;
      scene.add(mesh);
      world.createCollider(RAPIER.ColliderDesc.cuboid(w / 2, h / 2, d / 2).setTranslation(x, y, z));
      return mesh;
    }

    // Obstacles : marche, saut, rebord à escalader, mur haut, rampe.
    addBox(3, 0.2, -3, 2.2, 0.4, 2.2, 0xb08858);      // marche (0.4)
    addBox(6.4, 0.45, -3, 2.2, 0.9, 2.2, 0xa47d52);   // saut (0.9)
    addBox(-3, 0.8, -4.2, 2.6, 1.6, 2.6, 0xb08858);   // rebord à escalader (1.6)
    addBox(-5.2, 1.5, -0.5, 1.2, 3.0, 6.0, 0x7d6348); // mur haut (3.0) — bloque
    addBox(9.5, 1.4, -8, 6, 2.8, 6, 0x8a6a4a);        // gros bloc (2.8)

    // Rampe inclinée
    {
      const ramp = new T.Mesh(new T.BoxGeometry(3.2, 0.2, 8), new T.MeshStandardMaterial({ color: 0x9a7a52, roughness: 0.9 }));
      ramp.position.set(-9, 1.0, -6);
      ramp.rotation.x = -0.32;
      ramp.castShadow = ramp.receiveShadow = true;
      scene.add(ramp);
      const q = { x: Math.sin(-0.16), y: 0, z: 0, w: Math.cos(-0.16) };
      world.createCollider(RAPIER.ColliderDesc.cuboid(1.6, 0.1, 4).setTranslation(-9, 1.0, -6).setRotation(q));
    }

    // ---------- Personnage ----------
    const R = 0.35, HH = 0.5, CENTER_OFF = HH + R; // 0.85
    const body = world.createRigidBody(
      RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0, CENTER_OFF + 0.05, 0),
    );
    const collider = world.createCollider(RAPIER.ColliderDesc.capsule(HH, R), body);
    const controller = world.createCharacterController(0.02);
    controller.setUp({ x: 0, y: 1, z: 0 });
    controller.enableAutostep(0.42, 0.2, true);
    controller.enableSnapToGround(0.4);
    controller.setMaxSlopeClimbAngle(48 * Math.PI / 180);
    controller.setMinSlopeSlideAngle(35 * Math.PI / 180);

    function createHuman() {
      const g = new T.Group();
      const skin = new T.MeshStandardMaterial({ color: 0xc39a6b, roughness: 0.85 });
      const robe = new T.MeshStandardMaterial({ color: 0xe8e2d3, roughness: 0.9 });
      const dark = new T.MeshStandardMaterial({ color: 0x24242c, roughness: 0.9 });
      const hair = new T.MeshStandardMaterial({ color: 0x1d1a20, roughness: 0.95 });

      const torso = new T.Mesh(new T.CylinderGeometry(0.19, 0.25, 0.55, 10), robe);
      torso.position.y = 1.04;
      torso.castShadow = true;
      g.add(torso);

      const legs = {};
      for (const s of [-1, 1]) {
        const pivot = new T.Group();
        pivot.position.set(s * 0.1, 0.8, 0);
        const leg = new T.Mesh(new T.CylinderGeometry(0.07, 0.06, 0.8, 8), dark);
        leg.position.y = -0.4;
        leg.castShadow = true;
        pivot.add(leg);
        g.add(pivot);
        legs[s < 0 ? 'L' : 'R'] = pivot;
      }

      const arms = {};
      for (const s of [-1, 1]) {
        const pivot = new T.Group();
        pivot.position.set(s * 0.27, 1.24, 0);
        const arm = new T.Mesh(new T.CylinderGeometry(0.055, 0.05, 0.55, 8), robe);
        arm.position.y = -0.27;
        arm.castShadow = true;
        const hand = new T.Mesh(new T.SphereGeometry(0.06, 8, 6), skin);
        hand.position.y = -0.56;
        pivot.add(arm);
        pivot.add(hand);
        g.add(pivot);
        arms[s < 0 ? 'L' : 'R'] = pivot;
      }

      // Tête + visage 3D (géométrie, pas de texture PNG)
      const head = new T.Group();
      head.position.y = 1.44;
      g.add(head);
      const skull = new T.Mesh(new T.SphereGeometry(0.15, 12, 10), skin);
      skull.scale.set(1, 1.15, 1);
      skull.castShadow = true;
      head.add(skull);
      for (const s of [-1, 1]) {
        const eye = new T.Mesh(new T.SphereGeometry(0.022, 6, 6), dark);
        eye.position.set(s * 0.05, 0.02, 0.146);
        head.add(eye);
        const brow = new T.Mesh(new T.BoxGeometry(0.06, 0.012, 0.012), hair);
        brow.position.set(s * 0.05, 0.065, 0.14);
        head.add(brow);
      }
      const nose = new T.Mesh(new T.ConeGeometry(0.028, 0.07, 6), skin);
      nose.rotation.x = Math.PI / 2;
      nose.position.set(0, -0.01, 0.15);
      head.add(nose);
      const mouth = new T.Mesh(new T.BoxGeometry(0.075, 0.018, 0.012), dark);
      mouth.position.set(0, -0.06, 0.14);
      head.add(mouth);
      const cap = new T.Mesh(new T.SphereGeometry(0.155, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.55), hair);
      cap.position.y = 0.02;
      head.add(cap);
      const scarf = new T.Mesh(new T.CylinderGeometry(0.155, 0.16, 0.1, 10), dark);
      scarf.position.y = -0.12;
      head.add(scarf);

      g.userData = { legL: legs.L, legR: legs.R, armL: arms.L, armR: arms.R, head, torso };
      return g;
    }

    const bodyMesh = createHuman();
    scene.add(bodyMesh);

    // ---------- État / entrées ----------
    const keys = new Set();
    let grounded = false, vy = 0, heading = 0, moving = false, mx = 0, mz = 0, walkPhase = 0, climbing = null;
    let camYaw = 0, camPitch = 0.26, camDist = 7.0;
    let mantle = null, cooldown = 0;

    const forward = { x: 0, z: 0 }, right = { x: 0, z: 0 };

    addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
      keys.add(k);
      if (k === 'r') resetChar();
    });
    addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
    addEventListener('blur', () => keys.clear());

    // Caméra : glisser
    let dragging = false, lx = 0, ly = 0;
    canvas.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      camYaw -= (e.clientX - lx) * 0.006;
      camPitch = Math.max(-0.15, Math.min(0.95, camPitch + (e.clientY - ly) * 0.004));
      lx = e.clientX; ly = e.clientY;
    });
    canvas.addEventListener('pointerup', () => { dragging = false; });
    canvas.addEventListener('pointercancel', () => { dragging = false; });
    addEventListener('wheel', (e) => { camDist = Math.max(3.5, Math.min(12, camDist + e.deltaY * 0.004)); }, { passive: true });

    function resetChar() {
      vy = 0; mantle = null; cooldown = 0; climbing = null;
      body.setTranslation({ x: 0, y: CENTER_OFF + 0.05, z: 0 }, true);
    }

    // ---------- Escalade (mantle) ----------
    function rayHit(origin, dir, maxToi) {
      const h = world.castRay(new RAPIER.Ray(origin, dir), maxToi, true);
      if (!h) return null;
      const toi = (h.timeOfImpact !== undefined) ? h.timeOfImpact : h.toi;
      return { toi };
    }

    function tryMantle(t) {
      const f = { x: forward.x, z: forward.z };
      const o1 = { x: t.x + f.x * 0.5, y: t.y + 0.05, z: t.z + f.z * 0.5 };
      const wall = rayHit(o1, { x: f.x, y: 0, z: f.z }, 0.65);
      if (!wall) return null;
      const faceDist = 0.5 + wall.toi;
      const ox = t.x + f.x * (faceDist + 0.18);
      const oz = t.z + f.z * (faceDist + 0.18);
      const o2 = { x: ox, y: t.y + 1.95, z: oz };
      const ledge = rayHit(o2, { x: 0, y: -1, z: 0 }, 2.7);
      if (!ledge) return null;
      const ledgeY = o2.y - ledge.toi;
      const feetY = t.y - CENTER_OFF;
      const rel = ledgeY - feetY;
      if (rel < 0.35 || rel > 1.95) return null;
      return { x: t.x + f.x * (faceDist + 0.5), y: ledgeY + CENTER_OFF, z: t.z + f.z * (faceDist + 0.5) };
    }

    function startMantle(to) {
      const t = body.translation();
      mantle = { from: { x: t.x, y: t.y, z: t.z }, to, t: 0, dur: 0.26 };
      vy = 0;
    }

    function tryGrab(t) {
      const f = { x: forward.x, z: forward.z };
      const o1 = { x: t.x + f.x * 0.5, y: t.y + 0.05, z: t.z + f.z * 0.5 };
      const wall = rayHit(o1, { x: f.x, y: 0, z: f.z }, 0.65);
      if (!wall) return null;
      const n = { x: -f.x, z: -f.z };
      const faceDist = 0.5 + wall.toi;
      const fx = t.x + f.x * faceDist, fz = t.z + f.z * faceDist;
      const o2 = { x: fx - n.x * 0.35, y: t.y + 12, z: fz - n.z * 0.35 };
      const roof = rayHit(o2, { x: 0, y: -1, z: 0 }, 24);
      if (!roof) return null;
      const topY = o2.y - roof.toi;
      const feetY = t.y - CENTER_OFF;
      if (topY - feetY < 1.0) return null;
      return { fx, fz, normal: n, topY, y: t.y, u: 0, minY: CENTER_OFF + 0.05, grabTime: 0.2, tangent: { x: -n.z, z: n.x } };
    }

    // ---------- Boucle ----------
    const camTarget = new T.Vector3();
    const V = new T.Vector3();
    let last = performance.now();

    function shortestAngle(a, b) {
      let d = (b - a) % (Math.PI * 2);
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function updateMeshAndCamera(dt) {
      const t = body.translation();
      bodyMesh.position.set(t.x, t.y - CENTER_OFF, t.z);
      if (climbing) heading = Math.atan2(-climbing.normal.x, -climbing.normal.z);
      else if (moving) heading = Math.atan2(mx, mz);
      bodyMesh.rotation.y += shortestAngle(bodyMesh.rotation.y, heading) * Math.min(1, dt * 14);

      const H = bodyMesh.userData;
      const mag = Math.min(1, Math.hypot(mx, mz));
      if (climbing) {
        H.legL.rotation.x = -0.5; H.legR.rotation.x = -0.5;
        H.armL.rotation.x = -1.5; H.armR.rotation.x = -1.5;
        H.head.rotation.x = 0.12;
      } else if (grounded) {
        walkPhase += (mag * 4.8) * dt * 2.6;
        const sw = Math.sin(walkPhase) * 0.6 * mag;
        H.legL.rotation.x = sw; H.legR.rotation.x = -sw;
        H.armL.rotation.x = -sw * 0.8; H.armR.rotation.x = sw * 0.8;
        H.head.rotation.x = 0.02 * Math.sin(walkPhase * 2);
      } else {
        H.legL.rotation.x = -0.55; H.legR.rotation.x = 0.25;
        H.armL.rotation.x = -0.5; H.armR.rotation.x = -0.5;
      }

      const targetYaw = camYaw;
      forward.x = -Math.sin(targetYaw);
      forward.z = -Math.cos(targetYaw);
      right.x = Math.cos(targetYaw);
      right.z = -Math.sin(targetYaw);

      const head = { x: t.x, y: t.y + 0.9, z: t.z };
      const cx = t.x + Math.sin(camYaw) * camDist * Math.cos(camPitch);
      const cy = t.y + 1.0 + camDist * Math.sin(camPitch);
      const cz = t.z + Math.cos(camYaw) * camDist * Math.cos(camPitch);
      let dx = cx - head.x, dy = cy - head.y, dz = cz - head.z;
      let dist = Math.hypot(dx, dy, dz);
      if (dist < 0.001) { dx = 0; dy = 1; dz = 0; dist = 1; }
      const dir = { x: dx / dist, y: dy / dist, z: dz / dist };
      const hit = rayHit(head, dir, dist);
      let d = dist;
      if (hit) d = Math.max(1.0, hit.toi - 0.3);
      camTarget.set(head.x + dir.x * d, head.y + dir.y * d, head.z + dir.z * d);
      camera.position.lerp(camTarget, 0.28);
      camera.lookAt(t.x, t.y + 0.35, t.z);
    }

        function update(dt) {
      const t = body.translation();

      // Escalade en cours : accroché au mur
      if (climbing) {
        const c = climbing;
        const up = (keys.has('w') || keys.has('z') || keys.has('arrowup')) ? 1 : 0;
        const dn = (keys.has('s') || keys.has('arrowdown')) ? 1 : 0;
        const lf = (keys.has('a') || keys.has('q') || keys.has('arrowleft')) ? 1 : 0;
        const rt = (keys.has('d') || keys.has('arrowright')) ? 1 : 0;
        c.y += (up - dn) * 1.7 * dt;
        c.u += (rt - lf) * 1.1 * dt;
        c.u = Math.max(-1.4, Math.min(1.4, c.u));
        c.y = Math.max(c.minY, c.y);
        c.grabTime = Math.max(0, (c.grabTime || 0) - dt);
        if (keys.has(' ') && c.grabTime <= 0) { climbing = null; vy = 4.6; world.step(); updateMeshAndCamera(dt); return; }
        if (c.y + CENTER_OFF >= c.topY - 0.03) {
          startMantle({ x: c.fx - c.normal.x * 0.55, y: c.topY + CENTER_OFF, z: c.fz - c.normal.z * 0.55 });
          climbing = null;
          world.step();
          updateMeshAndCamera(dt);
          return;
        }
        if (dn > 0 && c.y <= c.minY + 0.002) { climbing = null; vy = 0; world.step(); updateMeshAndCamera(dt); return; }
        const px = c.fx + c.tangent.x * c.u + c.normal.x * 0.42;
        const pz = c.fz + c.tangent.z * c.u + c.normal.z * 0.42;
        body.setTranslation({ x: px, y: c.y, z: pz }, true);
        dbg.textContent = `grimpe · ${(c.y - CENTER_OFF).toFixed(1)} / ${c.topY.toFixed(1)} m`;
        world.step();
        updateMeshAndCamera(dt);
        return;
      }

      // Mantle en cours : animation scriptée
      if (mantle) {
        mantle.t += dt;
        const k = Math.min(1, mantle.t / mantle.dur);
        const e = k * k * (3 - 2 * k);
        body.setTranslation({
          x: mantle.from.x + (mantle.to.x - mantle.from.x) * e,
          y: mantle.from.y + (mantle.to.y - mantle.from.y) * e,
          z: mantle.from.z + (mantle.to.z - mantle.from.z) * e,
        }, true);
        if (k >= 1) mantle = null;
        world.step();
        updateMeshAndCamera(dt);
        return;
      }

      const fi = ((keys.has('w') || keys.has('z') || keys.has('arrowup')) ? 1 : 0)
        - ((keys.has('s') || keys.has('arrowdown')) ? 1 : 0);
      const ri = ((keys.has('d') || keys.has('arrowright')) ? 1 : 0)
        - ((keys.has('a') || keys.has('q') || keys.has('arrowleft')) ? 1 : 0);

      mx = forward.x * fi + right.x * ri;
      mz = forward.z * fi + right.z * ri;
      const ml = Math.hypot(mx, mz);
      if (ml > 1) { mx /= ml; mz /= ml; }
      const mag = Math.min(1, ml);
      moving = ml > 0.1;

      // Escalade / agrippement
      cooldown = Math.max(0, cooldown - dt);
      if (fi > 0 && moving && cooldown <= 0) {
        if (grounded) {
          const target = tryMantle(t);
          if (target) { startMantle(target); cooldown = 0.5; world.step(); updateMeshAndCamera(dt); return; }
        }
        const g = tryGrab(t);
        if (g) { climbing = g; vy = 0; cooldown = 0.35; world.step(); updateMeshAndCamera(dt); return; }
      }

      if (keys.has(' ') && grounded) { vy = 5.6; grounded = false; }
      vy -= 18 * dt;

      const speed = 4.8;
      const desired = { x: mx * speed * mag * dt, y: vy * dt, z: mz * speed * mag * dt };
      controller.computeColliderMovement(collider, desired);
      grounded = controller.computedGrounded();
      if (grounded && vy < 0) vy = 0;
      const mv = controller.computedMovement();
      body.setNextKinematicTranslation({ x: t.x + mv.x, y: t.y + mv.y, z: t.z + mv.z });

      world.step();
      updateMeshAndCamera(dt);

      dbg.textContent = `${grounded ? 'au sol' : 'en l’air'} · vy ${vy.toFixed(1)} · vitesse ${(mag * speed).toFixed(1)}`;
    }

    updateMeshAndCamera(0.016);

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  } catch (e) {
    dbg.textContent = 'Erreur : ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
