<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A pixel-art endless ride through the dunes at dusk.">
<title>Rihla · رحلة</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff0ce;background:#101222;font-family:system-ui,sans-serif}main{position:relative;height:100svh;min-height:420px;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:manipulation}.hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:clamp(16px,4vw,48px);font:700 14px ui-monospace,monospace;letter-spacing:.1em;text-shadow:0 2px #101222;pointer-events:none}.hud strong{display:block;font-size:24px}.menu{position:absolute;top:35%;left:50%;width:min(90%,460px);transform:translate(-50%,-50%);text-align:center;text-shadow:0 3px 10px #101222}.menu[hidden]{display:none}h1{font:900 clamp(52px,12vw,104px)/.95 Georgia,serif;margin:0;letter-spacing:-.05em}.arabic{display:block;color:#ffc997;font:700 25px Georgia,serif;margin-bottom:8px}p{margin:14px 0 20px}button{border:2px solid #fff0ce;background:#ffc997;color:#231726;padding:12px 24px;font:700 16px ui-monospace,monospace;cursor:pointer;box-shadow:4px 4px #432d40}button:focus-visible{outline:3px solid white;outline-offset:5px}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#221a2cdd;padding:8px 12px;font:14px ui-monospace,monospace;pointer-events:none}
</style>
</head>
<body><main>
<canvas aria-label="A rider seen from behind on a desert trail at dusk"></canvas>
<div class="hud"><div>DISTANCE<strong id="score">0 m</strong></div><div>BEST<strong id="best">0 m</strong></div></div>
<section class="menu" id="menu"><span class="arabic" lang="ar">رحلة</span><h1>Rihla</h1><p id="message">Ride the dunes at dusk.</p><button id="play">Start ride</button></section>
<div class="hint">Space / ↑ / tap to jump</div>
</main>
<script>
'use strict';
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const scoreLabel = document.querySelector('#score');
const bestLabel = document.querySelector('#best');
const menu = document.querySelector('#menu');
const message = document.querySelector('#message');
const play = document.querySelector('#play');
const height = 240;
const horizon = 112;
const feet = 204;
let width, center, state = 'ready', distance = 0, speed = 120;
let jump = 0, velocity = 0, nextRock = 195, rocks = [], best = 0;
try { best = Number(localStorage.getItem('rihla-best')) || 0; } catch {}
bestLabel.textContent = best + ' m';

function resize() {
  width = Math.round(height * canvas.clientWidth / canvas.clientHeight);
  center = width / 2;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

function rect(color, x, y, w, h) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.ceil(w), Math.ceil(h));
}

function noise(number) {
  const value = Math.sin(number * 127.1 + 9.2) * 43758.5453;
  return value - Math.floor(value);
}

// Each stretch is 120 displayed metres. Crossfade its final 35 metres.
const deserts = [
  ['332d53','655071','b65e63','ef9d59','58435f','694762','935862','ba7465','a3685c','ac6e5d'],
  ['101938','283055','54476c','a17386','383750','48405f','66516c','806470','74566a','805e70'],
  ['494567','a37484','efab80','ffdc94','876477','a87978','c38970','dca273','b97e64','c58a69']
].map(colors => colors.map(hex => parseInt(hex, 16)));

function trailX(depth) {
  return center + Math.min(width * .22, 55) * (1 - 1.55 * depth);
}

function elevation(position) {
  return 30 * Math.sin(position / 175) + 9 * Math.sin(position / 91);
}

// Project the height difference relative to the horse, including camera pitch.
function groundY(depth) {
  const ahead = 430 * (1 - Math.sqrt(Math.max(0, depth)));
  const rise = elevation(distance + ahead) - elevation(distance);
  const pitch = (elevation(distance + 8) - elevation(distance - 8)) * 2;
  return horizon + depth * (feet - horizon) - rise * Math.sqrt(depth) + pitch * (1 - depth);
}

function ridgeY(x, layer) {
  const p = x + distance * (layer + 1) * .014;
  return 101 + layer * 12 + Math.sin(p / (31 - layer * 3) + layer) * (12 - layer)
    + Math.sin(p / 17 + layer * 2) * 3;
}

function drawCaravan(time) {
  const loop = width + 70;
  const lead = ((width * .34 + time * .003 - distance * .012) % loop + loop) % loop;
  const coat = '#4a3540';
  for (let i = 0; i < 3; i++) {
    const x = lead - i * 18;
    const y = Math.round(ridgeY(x, 0));
    const step = .5 + .5 * Math.sin(time / 205 + i * 2);
    rect(coat, x - 4, y - 6, 8, 3);
    rect(coat, x - 2, y - 8, 4, 3);
    rect(coat, x + 3, y - 8, 2, 4);
    rect(coat, x + 4, y - 10, 2, 3);
    rect(coat, x + 5, y - 10, 3, 1);
    rect(coat, x - 5, y - 5, 1, 3);
    for (const offset of [-3, 2]) {
      rect(coat, x + offset, y - 3, 1, 2);
      rect(coat, x + offset + (offset < 0 ? step : -step), y - 2, 1, 3);
    }
  }
}

function windSand(time, layer) {
  const cycle = time * .009;
  ctx.globalAlpha = .42;
  for (let i = 0; i < 8; i++) {
    const x = (noise(i + 74) * width + cycle - distance * .016 + width * 1000) % (width + 12) - 6;
    for (let j = 0; j < 3; j++) {
      const px = x - j * 3;
      const py = ridgeY(px, layer) - 1 - Math.max(0, Math.sin(time / 480 + i + j * .3)) * 2;
      rect('#edb989', px, py, 3 - j, 1);
    }
  }
  ctx.globalAlpha = 1;
}

function landscape(time) {
  const metres = distance / 8;
  const region = Math.floor(metres / 120) % deserts.length;
  const next = (region + 1) % deserts.length;
  const blend = Math.max(0, (metres % 120 - 85) / 35);
  const colors = deserts[region].map((value, i) => {
    const target = deserts[next][i];
    const channels = [16, 8, 0].map(shift => {
      const a = (value >> shift) & 255, b = (target >> shift) & 255;
      return Math.round(a + (b - a) * blend);
    });
    return 'rgb(' + channels.join(',') + ')';
  });
  const weight = id => (region === id ? 1 - blend : 0) + (next === id ? blend : 0);
  const sky = ctx.createLinearGradient(0, 0, 0, 150);
  colors.slice(0, 4).forEach((color, i) =>
    sky.addColorStop(i / 3, color));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);
  for (let i = 0; i < width / 2; i++) {
    const size = i % 13 === 0 ? 2 : 1;
    rect(i % 3 === 0 ? '#f9ca9a' : '#a78ba9', noise(i) * width, noise(i + 800) * 95, size, size);
  }
  for (let band = 0; band < 10; band++) {
    const start = noise(band + 211) * (width + 110) - 80;
    const length = 45 + noise(band + 51) * 110;
    const baseline = 7 + band * 8;
    for (let dx = 0; dx < length; dx += 2) {
      const taper = Math.sin(dx / length * Math.PI);
      const ripple = Math.sin(dx / 12 + band) * 3 + Math.sin(dx / 5) * 2;
      const top = baseline + ripple - taper * (5 + band % 4);
      const thickness = taper * (5 + 4 * noise(band + 9));
      rect(band > 4 ? '#bf6962' : '#8c5366', start + dx, top, 2, thickness);
      if (thickness > 2) rect(band > 4 ? '#eb9660' : '#bd6c65', start + dx, top + thickness - 1, 2, 2);
    }
  }
  for (let layer = 0; layer < 4; layer++) {
    const color = colors[4 + layer];
    for (let x = 0; x < width; x += 2) {
      const drift = distance * (layer + 1) * .014;
      const y = ridgeY(x, layer);
      const cliffs = layer === 1 ? (.22 + .78 * weight(1)) * Math.max(0, Math.min(27, 80 * Math.sin((x + drift) / 26))) : 0;
      rect(color, x, y - cliffs, 2, height - y + cliffs);
    }
    if (layer === 0) drawCaravan(time);
    if (layer === 2) windSand(time, layer);
  }
  {
    ctx.globalAlpha = .45 + .55 * weight(2);
    const origin = -((distance * .024) % 160);
    for (let x = origin; x < width; x += 160) {
      rect(colors[5], x, 103, 32, 7);
      for (const offset of [0, 11, 26]) {
        const top = offset === 11 ? 88 : 83;
        rect(colors[5], x + offset, top, 5, 110 - top);
        rect(colors[4], x + offset - 1, top, 7, 2);
      }
      rect(colors[4], x - 1, 81, 12, 3);
    }
    ctx.globalAlpha = 1;
  }
  const travel = distance * 0.01;
  for (let y = horizon; y < height + 36; y++) {
    const depth = (y - horizon) / (height - horizon);
    const edge = 3 + depth * depth * width * 0.26;
    const stripe = Math.sin(34 / (depth + 0.19) + travel) > 0.65;
    const projection = (y - horizon) / (feet - horizon);
    const surface = groundY(projection);
    const nextRow = groundY(projection + 1 / (feet - horizon));
    const thickness = Math.max(1, Math.ceil(nextRow - surface) + 1);
    rect(stripe ? colors[8] : colors[9], trailX(projection) - edge, surface, edge * 2, thickness);
  }
  for (let i = 0; i < 44; i++) {
    const depth = (noise(i + 91) + travel * 0.22) % 1;
    const y = horizon + depth ** 2 * (height - horizon);
    const x = trailX((y - horizon) / (feet - horizon)) + (noise(i + 323) - 0.5) * width * depth;
    const surface = groundY((y - horizon) / (feet - horizon));
    rect(i % 2 ? '#dc926d' : '#8f5355', x, surface, 1 + depth * 7, 1);
  }
}

const dust = [];
let stride = 0;

function scatterDust(count, strength) {
  for (let i = 0; i < count; i++) {
    const side = i % 2 ? 1 : -1;
    dust.push({
      x: side * (4 + Math.random() * 7),
      y: 1 + Math.random() * 3,
      vx: side * (12 + Math.random() * strength),
      vy: -5 - Math.random() * 14,
      life: 0.25 + Math.random() * 0.2
    });
  }
}

let landing = 0;
function tickAnimation(dt, landed) {
  landing = landed ? .14 : Math.max(0, landing - dt);
  const phase = Math.floor(stride);
  stride += dt * (8 + speed / 22);
  if (landed) scatterDust(12, 30);
  else if (!jump && Math.floor(stride) !== phase) scatterDust(2, 10);

  for (const grain of dust) {
    grain.x += grain.vx * dt;
    grain.y += grain.vy * dt;
    grain.vy += 38 * dt;
    grain.life -= dt;
  }
  while (dust.length && dust[0].life <= 0) dust.shift();
}

const mount = new Image();
const poses = [];
mount.onload = () => {
  const sheet = document.createElement('canvas');
  sheet.width = mount.width;
  sheet.height = mount.height;
  const painter = sheet.getContext('2d');
  painter.drawImage(mount, 0, 0);
  const pixels = painter.getImageData(0, 0, sheet.width, sheet.height).data;
  const cell = Math.floor(sheet.width / 4);
  for (let pose = 0; pose < 8; pose++) {
    const offsetX = (pose % 4) * cell;
    const cellHeight = Math.floor(sheet.height / 2);
    const offsetY = Math.floor(pose / 4) * cellHeight;
    let left = cell, right = 0, top = sheet.height, bottom = 0;
    for (let y = 0; y < cellHeight; y++) {
      for (let x = 0; x < cell; x++) {
        if (pixels[4 * ((y + offsetY) * sheet.width + offsetX + x) + 3] < 64) continue;
        left = Math.min(left, x);
        right = Math.max(right, x);
        top = Math.min(top, y);
        bottom = Math.max(bottom, y);
      }
    }
    poses.push([offsetX + left, offsetY + top, right-left+1, bottom-top+1]);
  }
};

function drawRider(time) {
  const phase = jump ? 6 : landing ? 7 : state === 'running' ? Math.floor(stride) % 6 : 0;
  const riderX = trailX(1);
  const pose = poses[phase];
  rect('#784952', riderX - 12 + jump * .1, feet, 24 - jump * .2, 3);
  for (const grain of dust) {
    if (grain.life > 0) rect('#df9d78', riderX + grain.x, feet + grain.y, 2, 2);
  }
  if (!pose) return;
  const bob = state === 'running' ? Math.sin(stride * Math.PI / 2) * 1.4 : Math.sin(time / 600) * .4;
  const spriteHeight = 69;
  const spriteWidth = spriteHeight * pose[2] / pose[3];
  ctx.drawImage(mount, ...pose, Math.round(riderX - spriteWidth / 2),
    Math.round(feet - jump - spriteHeight - bob), spriteWidth, spriteHeight);
}

// Paint props in world order so the nearest silhouettes overlap distant ones.
function scenery() {
  const first = Math.max(0, Math.floor((distance - 90) / 160));
  const last = Math.floor((distance + 430) / 160);
  for (let i = last; i >= first; i--) {
    const z = (i + 1) * 160 - distance;
    if (z > 430 || z < -90) continue;
    const scale = (1 - z / 430) ** 2;
    const side = i % 2 ? 1 : -1;
    const x = trailX(scale) + side * (8 + (.23 + noise(i + 12) * .08) * width * scale);
    const y = groundY(scale);
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.scale(scale, scale);
    if ((i + 1) % 25 === 0) {
      for (let row = -6; row <= 6; row++) {
        const half = Math.sqrt(1 - row * row / 36) * 27;
        rect(row < 0 ? '#37696e' : '#509797', -half, row, 2 * half, 1);
      }
      rect('#97cbb0', -14, 1, 15, 1);
      palm(-17, -3, .9);
      palm(13, -4, 1.2);
    } else if (i % 5 === 2) {
      for (let row = 0; row < 16; row++) {
        rect('#784348', -row, -16 + row, row * 2 + 1, 1);
        rect('#be7753', -row, -16 + row, row + 1, 1);
        if (row > 8) rect('#382b37', -2, -16 + row, row - 8, 1);
      }
      rect('#5b3943', -1, -20, 2, 5);
      rect('#ffcb86', 17, -3, 2, 3);
    } else if (i % 3 !== 1) {
      palm(0, 0, .85 + noise(i + 73) * .4);
    } else {
      for (let blade = 0; blade < 7; blade++) {
        const length = 4 + noise(i + blade) * 7;
        for (let k = 0; k < length; k++)
          rect(blade % 2 ? '#7b7053' : '#525b50', (blade - 3) * k * .38, -k, 2, 2);
      }
    }
    ctx.restore();
  }
}

function palm(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size, size);
  for (let k = 0; k < 26; k++) {
    const bend = 4 * Math.sin(k / 17);
    rect(k % 5 < 2 ? '#956751' : '#66494a', bend - 2, -k, 3, 2);
  }
  for (let leaf = 0; leaf < 9; leaf++) {
    const angle = Math.PI * (leaf / 8);
    for (let k = 0; k < 14; k++) {
      const dx = 4 + Math.cos(angle) * k * 1.3;
      const dy = -25 - Math.sin(angle) * k - k * .65 + k * k * .08;
      rect(leaf % 2 ? '#345c53' : '#496f59', dx, dy, 3, 2);
      if (k % 3 === 0) rect('#34564d', dx, dy + 2, 1, 3);
    }
  }
  ctx.restore();
}

function drawGap(gap) {
  const near = Math.max(0, 1 - gap.z / 430) ** 2;
  const far = Math.max(0, 1 - (gap.z + gap.length) / 430) ** 2;
  const front = groundY(near);
  const back = groundY(far);
  const span = Math.max(2, near * width * .27);
  const left = trailX(near) - span / 2;
  for (let dx = 0; dx < span; dx += 2) {
    const notch = Math.sin(dx / span * 23) * near * 1.5;
    rect('#c59791', left + dx, back + notch - 1, 2, 2);
    rect('#292136', left + dx, back + notch + 1, 2, Math.max(1, front - back));
    rect('#e9ae84', left + dx, front + notch, 2, Math.max(1, 2 * near));
  }
}

function drawRock(rock) {
  if (rock.length) return drawGap(rock);
  const depth = Math.max(0, (1 - rock.z / 430));
  const y = groundY(depth ** 2);
  const size = Math.max(1, depth ** 2 * rock.size);
  const x = trailX(depth ** 2) - size * .08;
  rect('#563849', x - size * .22, y - 1, size * 1.4, Math.max(1, size * .17));
  rect('#50334c', x, y - size * 0.6, size, size * 0.6);
  rect('#714957', x + size * 0.15, y - size * 0.82, size * 0.65, size * 0.47);
  rect('#eda177', x + size * 0.18, y - size * 0.82, size * 0.46, size * 0.13);
}

function startOrJump() {
  if (state !== 'running') {
    state = 'running';
    distance = jump = velocity = stride = landing = 0;
    dust.length = 0;
    speed = 120;
    nextRock = 195;
    rocks = [{ z: 360, size: 20 }];
    menu.hidden = true;
    scoreLabel.textContent = '0 m';
    return;
  }
  if (jump === 0) velocity = 155;
}

play.addEventListener('click', startOrJump);
canvas.addEventListener('pointerdown', startOrJump);
window.addEventListener('keydown', event => {
  if (event.code !== 'Space' && event.code !== 'ArrowUp') return;
  if (event.code === 'Space' && document.activeElement === play && !menu.hidden) return;
  event.preventDefault();
  if (!event.repeat) startOrJump();
});

function update(dt) {
  const difficulty = Math.min(1, distance / (8 * 600));
  const slope = (elevation(distance + 8) - elevation(distance - 8)) / 16;
  speed = (120 + 150 * difficulty) * (1 - .42 * slope);
  const advance = speed * dt;
  distance += advance;
  nextRock -= advance;
  if (nextRock <= 0) {
    const arrivalMetres = (distance + 430) / 8;
    const canyon = Math.floor(arrivalMetres / 120) % 3 === 1;
    rocks.push(canyon ? { z: 430, length: speed * .32 } : { z: 430, size: 17 + Math.random() * 8 });
    nextRock = canyon ? speed * 2.5 : speed * (1.85 - 0.5 * difficulty + Math.random() * 0.4);
  }
  const wasAirborne = jump > 0;
  if (velocity || jump) {
    jump = Math.max(0, jump + velocity * dt);
    velocity = jump > 0 ? velocity - 365 * dt : 0;
  }
  tickAnimation(dt, wasAirborne && jump === 0);
  const score = Math.floor(distance / 8);
  scoreLabel.textContent = score + ' m';
  for (const rock of rocks) {
    rock.z -= advance;
    const missed = rock.length
      ? rock.z <= 0 && rock.z >= -rock.length && jump <= 0
      : rock.z <= 11 && rock.z >= -13 && jump < rock.size * 0.72;
    if (missed) {
      state = 'over';
      best = Math.max(best, score);
      try { localStorage.setItem('rihla-best', best); } catch {}
      bestLabel.textContent = best + ' m';
      message.textContent = 'Your ride ended at ' + score + ' m.';
      play.textContent = 'Ride again';
      menu.hidden = false;
      return;
    }
  }
  rocks = rocks.filter(rock => rock.z > -(rock.length || 0) - 18);
}

let previous = performance.now();
function frame(time) {
  const dt = Math.min(0.033, (time - previous) / 1000);
  previous = time;
  if (state === 'running') update(dt);
  landscape(time);
  scenery();
  for (let i = rocks.length - 1; i >= 0; i--) drawRock(rocks[i]);
  drawRider(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
