<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A pixel-art endless ride through the dunes at dusk.">
<title>Rihla · رحلة</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff0ce;background:#101222;font-family:system-ui,sans-serif}main{position:relative;height:100svh;min-height:420px;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:manipulation}.hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:clamp(16px,4vw,48px);font:700 14px ui-monospace,monospace;letter-spacing:.1em;text-shadow:0 2px #101222;pointer-events:none}.hud strong{display:block;font-size:24px}.menu{position:absolute;top:35%;left:50%;width:min(90%,460px);transform:translate(-50%,-50%);text-align:center;text-shadow:0 3px 10px #101222}.menu[hidden]{display:none}h1{font:900 clamp(52px,12vw,104px)/.95 Georgia,serif;margin:0;letter-spacing:-.05em}.arabic{display:block;color:#ffc997;font:700 25px Georgia,serif;margin-bottom:8px}p{margin:14px 0 20px}button{border:2px solid #fff0ce;background:#ffc997;color:#231726;padding:12px 24px;font:700 16px ui-monospace,monospace;cursor:pointer;box-shadow:4px 4px #432d40}button:focus-visible{outline:3px solid white;outline-offset:5px}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#221a2cdd;padding:8px 12px;font:14px ui-monospace,monospace;pointer-events:none}
</style>
</head>
<body><main>
<canvas aria-label="A rider seen from behind on a desert trail at dusk"></canvas>
<div class="hud"><div>DISTANCE<strong id="score">0 m</strong></div><div>BEST<strong id="best">0 m</strong></div></div>
<section class="menu" id="menu"><span class="arabic" lang="ar">رحلة</span><h1>Rihla</h1><p id="message">Ride the dunes at dusk.</p><button id="play">Start ride</button></section>
<div class="hint">Space / ↑ / tap to jump</div>
</main>
<script>
'use strict';
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const scoreLabel = document.querySelector('#score');
const bestLabel = document.querySelector('#best');
const menu = document.querySelector('#menu');
const message = document.querySelector('#message');
const play = document.querySelector('#play');
const height = 240;
const horizon = 112;
const feet = 204;
let width, center, state = 'ready', distance = 0, speed = 120;
let jump = 0, velocity = 0, nextRock = 195, rocks = [], best = 0;
try { best = Number(localStorage.getItem('rihla-best')) || 0; } catch {}
bestLabel.textContent = best + ' m';

function resize() {
  width = Math.round(height * canvas.clientWidth / canvas.clientHeight);
  center = width / 2;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

function rect(color, x, y, w, h) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.ceil(w), Math.ceil(h));
}

function noise(number) {
  const value = Math.sin(number * 127.1 + 9.2) * 43758.5453;
  return value - Math.floor(value);
}

function landscape() {
  const sky = ctx.createLinearGradient(0, 0, 0, 150);
  ['#332d53', '#655071', '#b65e63', '#ef9d59'].forEach((color, i) =>
    sky.addColorStop(i / 3, color));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);
  for (let i = 0; i < width / 2; i++) {
    const size = i % 13 === 0 ? 2 : 1;
    rect(i % 3 === 0 ? '#f9ca9a' : '#a78ba9', noise(i) * width, noise(i + 800) * 95, size, size);
  }
  for (let band = 0; band < 10; band++) {
    const start = noise(band + 211) * (width + 110) - 80;
    const length = 45 + noise(band + 51) * 110;
    const baseline = 7 + band * 8;
    for (let dx = 0; dx < length; dx += 2) {
      const taper = Math.sin(dx / length * Math.PI);
      const ripple = Math.sin(dx / 12 + band) * 3 + Math.sin(dx / 5) * 2;
      const top = baseline + ripple - taper * (5 + band % 4);
      const thickness = taper * (5 + 4 * noise(band + 9));
      rect(band > 4 ? '#bf6962' : '#8c5366', start + dx, top, 2, thickness);
      if (thickness > 2) rect(band > 4 ? '#eb9660' : '#bd6c65', start + dx, top + thickness - 1, 2, 2);
    }
  }
  for (let layer = 0; layer < 4; layer++) {
    const color = ['#58435f', '#694762', '#935862', '#ba7465'][layer];
    for (let x = 0; x < width; x += 2) {
      const drift = distance * (layer + 1) * 0.014;
      const y = 101 + layer * 12 + Math.sin((x + drift) / (31 - layer * 3) + layer) * (12 - layer)
        + Math.sin((x + drift) / 17 + layer * 2) * 3;
      rect(color, x, y, 2, height - y);
    }
  }
  const travel = distance * 0.01;
  for (let y = horizon; y < height; y++) {
    const depth = (y - horizon) / (height - horizon);
    const edge = 3 + depth * depth * width * 0.26;
    const stripe = Math.sin(34 / (depth + 0.19) + travel) > 0.65;
    rect(stripe ? '#a3685c' : '#ac6e5d', center - edge, y, edge * 2, 1);
  }
  for (let i = 0; i < 44; i++) {
    const depth = (noise(i + 91) + travel * 0.22) % 1;
    const y = horizon + depth ** 2 * (height - horizon);
    const x = center + (noise(i + 323) - 0.5) * width * depth;
    rect(i % 2 ? '#dc926d' : '#8f5355', x, y, 1 + depth * 7, 1);
  }
}

const gallop = [[-5, 1, -3, -3], [-2, -4, 1, -5], [0, -2, 4, 1], [-3, 0, -2, 2]];
const dust = [];
let stride = 0;

function scatterDust(count, strength) {
  for (let i = 0; i < count; i++) {
    const side = i % 2 ? 1 : -1;
    dust.push({
      x: side * (4 + Math.random() * 7),
      y: 1 + Math.random() * 3,
      vx: side * (12 + Math.random() * strength),
      vy: -5 - Math.random() * 14,
      life: 0.25 + Math.random() * 0.2
    });
  }
}

function tickAnimation(dt, landed) {
  const phase = Math.floor(stride);
  stride += dt * (8 + speed / 22);
  if (landed) scatterDust(12, 30);
  else if (!jump && Math.floor(stride) !== phase) scatterDust(2, 10);

  for (const grain of dust) {
    grain.x += grain.vx * dt;
    grain.y += grain.vy * dt;
    grain.vy += 38 * dt;
    grain.life -= dt;
  }
  while (dust.length && dust[0].life <= 0) dust.shift();
}

function pixelShape(color, points) {
  ctx.fillStyle = color;
  ctx.beginPath();
  points.forEach(([x, y], i) => {
    if (i === 0) ctx.moveTo(Math.round(x), Math.round(y));
    else ctx.lineTo(Math.round(x), Math.round(y));
  });
  ctx.closePath();
  ctx.fill();
}

function drawRider(time) {
  const running = state === 'running';
  const phase = Math.floor(stride) % gallop.length;
  const legs = jump ? [-7, -6, -6, -7] : running ? gallop[phase] : [0, 0, 0, 0];
  const bob = running && !jump ? [0, 2, 1, 0][phase] : 0;
  const sway = Math.round(Math.sin(time / (running ? 76 : 290)) * (running ? 3 : 1));
  const x = Math.round(center);
  const y = Math.round(feet - 49 - jump - bob);

  rect('#784952', x - 15 + jump * 0.12, feet + 1, 30 - jump * 0.24, 3);
  for (const grain of dust) {
    if (grain.life > 0) {
      rect(grain.life > 0.18 ? '#e5a27c' : '#bc806a', x + grain.x, feet + grain.y, grain.life > 0.25 ? 3 : 2, 2);
    }
  }

  legs.forEach((lift, i) => {
    const hip = x + [-12, 9, -8, 6][i];
    const ankle = hip + (i % 2 ? 2 : -2);
    const hoof = y + 47 + lift;
    const color = i < 2 ? '#43293c' : '#663d49';
    rect(color, hip, y + 31, 4, 9 + lift / 2);
    rect(color, ankle, y + 37 + lift / 2, 4, hoof - (y + 37 + lift / 2));
    rect('#2d2031', ankle - 1, hoof, 6, 3);
  });

  const shape = (color, points) => pixelShape(color, points.map(([dx, dy]) => [x + dx, y + dy]));
  const outline = '#17141e';
  const coat = '#29232c';

  // A raised neck and offset head give the rear silhouette a three-quarter view.
  shape(outline, [[-18,34],[-16,25],[-11,21],[3,20],[10,16],[13,9],[16,7],
    [16,1],[19,3],[20,7],[24,8],[26,4],[28,4],[28,12],[33,18],
    [33,22],[28,23],[23,19],[20,18],[18,31],[13,39],[6,43],[-7,43],[-15,39]]);
  shape(coat, [[-16,33],[-13,25],[-5,23],[8,25],[15,21],[19,12],
    [24,12],[29,19],[26,20],[21,15],[17,29],[13,36],[5,40],[-8,41],[-14,38]]);
  shape('#3b3038', [[-15,31],[-10,25],[-3,25],[1,29],[-4,31],[-8,37],[-13,36]]);
  shape('#362a30', [[14,22],[17,12],[20,9],[24,10],[21,13],[19,17],[18,24],[15,29]]);
  shape('#594035', [[17,14],[20,13],[23,16],[27,18],[32,19],[31,21],
    [27,20],[24,18],[20,16],[18,17]]);
  rect('#a98467', x + 24, y + 13, 1, 1);
  shape(outline, [[-8,36],[-5,37],[-6,43],[-8+sway,48],[-12+sway,50],
    [-13+sway,47],[-10,43]]);
  shape('#42303a', [[-8,39],[-7,40],[-9,45],[-11+sway,48],[-10+sway,44]]);

  // Layered fabric folds and a narrow rim light catch the sunset.
  shape('#251a1d', [[-10,8],[-4,5],[4,7],[9,14],[10,20],[13,25],[11,30],
    [6,31],[3,28],[-1+sway,35],[-10+sway,38],[-17+sway,35],[-17,28],[-14,19]]);
  shape('#503124', [[-9,10],[-4,7],[4,9],[7,15],[7,22],[10,26],[7,29],
    [2,25],[-2+sway,32],[-9+sway,36],[-15+sway,34],[-15,28],[-12,18]]);
  shape('#714629', [[-12,15],[-8,10],[-2,9],[4,13],[2,15],[-5,13],[-10,17],
    [-11,26],[-9+sway,32],[-13+sway,34],[-14,28]]);
  shape('#8b5936', [[-10,15],[-6,12],[-1,12],[2,14],[-5,14],[-9,17],[-11,23]]);
  shape('#342326', [[-5,16],[-3,16],[-5,23],[-3,27],[-1+sway,29],[-6+sway,34],
    [-5+sway,30],[-8,25],[-7,20]]);
  shape('#775036', [[1,16],[4,16],[5,22],[9,25],[8,27],[4,25],[2,21]]);
  rect('#9c6342', x + 10, y + 24, 3, 2);
  shape('#17151d', [[-10,6],[-11,1],[-9,-3],[-6,-5],[2,-6],[7,-4],[9,0],
    [7,4],[7,8],[3,10],[-4,9],[-8,10]]);
  shape('#32303a', [[-10,1],[-7,-3],[0,-5],[5,-4],[6,-2],[-1,-2],[-6,0]]);
  shape('#26232d', [[-10,3],[-6,1],[1,0],[7,-1],[7,2],[2,3],[-4,5],[-8,5]]);
  shape('#805338', [[4,3],[7,2],[8,4],[7,6],[5,6]]);
  shape('#29242a', [[-9,6],[-4,7],[3,6],[7,5],[7,8],[3,10],[-5,9]]);
}

function drawRock(rock) {
  const depth = Math.max(0, (1 - rock.z / 430));
  const y = horizon + depth ** 2 * (feet - horizon);
  const size = Math.max(1, depth ** 2 * rock.size);
  const x = center - size / 2;
  rect('#774653', x - 2, y, size + 4, size * 0.18);
  rect('#50334c', x, y - size * 0.6, size, size * 0.6);
  rect('#714957', x + size * 0.15, y - size * 0.82, size * 0.65, size * 0.47);
  rect('#eda177', x + size * 0.18, y - size * 0.82, size * 0.46, size * 0.13);
}

function startOrJump() {
  if (state !== 'running') {
    state = 'running';
    distance = jump = velocity = stride = 0;
    dust.length = 0;
    speed = 120;
    nextRock = 195;
    rocks = [{ z: 360, size: 20 }];
    menu.hidden = true;
    scoreLabel.textContent = '0 m';
    return;
  }
  if (jump === 0) velocity = 155;
}

play.addEventListener('click', startOrJump);
canvas.addEventListener('pointerdown', startOrJump);
window.addEventListener('keydown', event => {
  if (event.code !== 'Space' && event.code !== 'ArrowUp') return;
  if (event.code === 'Space' && document.activeElement === play && !menu.hidden) return;
  event.preventDefault();
  if (!event.repeat) startOrJump();
});

function update(dt) {
  speed = Math.min(260, speed + dt * 3.6);
  const advance = speed * dt;
  distance += advance;
  nextRock -= advance;
  if (nextRock <= 0) {
    rocks.push({ z: 430, size: 17 + Math.random() * 8 });
    nextRock = speed * (1.45 + Math.random() * 0.65);
  }
  const wasAirborne = jump > 0;
  if (velocity || jump) {
    jump = Math.max(0, jump + velocity * dt);
    velocity = jump > 0 ? velocity - 365 * dt : 0;
  }
  tickAnimation(dt, wasAirborne && jump === 0);
  const score = Math.floor(distance / 8);
  scoreLabel.textContent = score + ' m';
  for (const rock of rocks) {
    rock.z -= advance;
    if (rock.z <= 11 && rock.z >= -13 && jump < rock.size * 0.72) {
      state = 'over';
      best = Math.max(best, score);
      try { localStorage.setItem('rihla-best', best); } catch {}
      bestLabel.textContent = best + ' m';
      message.textContent = 'Your ride ended at ' + score + ' m.';
      play.textContent = 'Ride again';
      menu.hidden = false;
      return;
    }
  }
  rocks = rocks.filter(rock => rock.z > -18);
}

let previous = performance.now();
function frame(time) {
  const dt = Math.min(0.033, (time - previous) / 1000);
  previous = time;
  if (state === 'running') update(dt);
  landscape();
  for (let i = rocks.length - 1; i >= 0; i--) drawRock(rocks[i]);
  drawRider(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
